services:
  db:
    environment:
      POSTGRES_DB: your5e_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U your5e -d your5e_test"]
    volumes: !override
      - type: tmpfs
        target: /var/lib/postgresql/data

  web:
    ports: !override
      - "5853:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=1)"]
      interval: 2s
      timeout: 2s
      retries: 30
    environment:
      SECRET_KEY: "test"
      DB_NAME: "your5e_test"

  api:
    ports: !override
      - "5854:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=1)"]
      interval: 2s
      timeout: 2s
      retries: 30
    environment:
      SECRET_KEY: "test"
      DB_NAME: "your5e_test"
      WEB_BASE_URL: "http://localhost:5853"
