services:
  db:
    image: postgres:17
    command:
      - "postgres"
      - "-c"
      - "fsync=off"
      - "-c"
      - "full_page_writes=off"
      - "-c"
      - "log_checkpoints=off"
      - "-c"
      - "synchronous_commit=off"
    environment:
      POSTGRES_DB: your5e
      POSTGRES_USER: your5e
      POSTGRES_PASSWORD: your5e
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U your5e"]
      interval: 2s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5843:8000"
    volumes:
      - .:/app
    environment:
      DEBUG: "1"
      PYTHONUNBUFFERED: "1"
      SECRET_KEY: "dev"
      DB_NAME: "your5e"
      DB_USER: "your5e"
      DB_PASSWORD: "your5e"
      DB_HOST: "db"
      DB_PORT: "5432"
      DJANGO_SETTINGS_MODULE: "config.settings.web"

  api:
    build:
      context: .
      target: dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5844:8000"
    volumes:
      - .:/app
    environment:
      DEBUG: "1"
      PYTHONUNBUFFERED: "1"
      SECRET_KEY: "dev"
      DB_NAME: "your5e"
      DB_USER: "your5e"
      DB_PASSWORD: "your5e"
      DB_HOST: "db"
      DB_PORT: "5432"
      DJANGO_SETTINGS_MODULE: "config.settings.api"
      WEB_BASE_URL: "http://localhost:5843"

  sass:
    build:
      context: .
      target: base
    volumes:
      - .:/app
    command: sass --watch static/css/source/screen.scss:static/css/screen.css

volumes:
  postgres_data:
