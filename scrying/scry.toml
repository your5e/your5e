path = "/profile/norm/password"

# campaigns
# ----------------------------------------------------------------------------
[pages.campaigns-list]
user = "norm"
path = "/campaigns/"

[pages.campaign-create]
user = "norm"
path = "/campaigns/create"

[pages.campaign-created]
user = "norm"
path = "/campaigns/create"
steps = [
    { fill = { field = "name", value = "Some dungeons, some dragons" } },
    { fill = { field = "description", value = "A test campaign, for fighting **dragons**!" } },
    { click = { text = "Create campaign", role = "button" } },
]

[pages.campaign-view]
user = "norm"
path = "/campaigns/norm/the-long-road"

[pages.campaign-settings]
user = "norm"
path = "/campaigns/settings/norm/the-long-road"
steps = [
    { capture = { selector = "#invite-link", pattern = "(/campaigns/join-[^\\s]+)", as = "join_url" } },
]

[pages.campaign-delete]
user = "norm"
path = "/campaigns/settings/norm/the-long-road"
steps = [
    { click = { text = "Delete campaign", role = "button" } },
]

[pages.campaign-join]
user = "susan"
path = "{join_url}"

[pages.campaign-leave]
user = "susan"
path = "/campaigns/wendy/secrets-of-the-tower"
steps = [
    { click = { text = "Leave campaign", role = "button" } },
]

[pages.campaign-wiki]
user = "norm"
path = "/campaigns/norm/the-long-road/wiki/"

[pages.campaign-wiki-notebook]
user = "norm"
path = "/campaigns/norm/the-long-road/wiki/campaign-notes/"

[pages.campaign-wiki-page]
user = "norm"
path = "/campaigns/wendy/secrets-of-the-tower/wiki/wendy/world-building/places/the-capital"

[pages.campaign-wiki-page-long-name]
user = "norm"
path = "/campaigns/norm/whispers-from-the-forgotten-crypts-beneath-the-mountains-of-eternal-sorrow/wiki/comprehensive-bestiary-and-geographical-survey-of-the-blighted-territories-including-appendices-on-local-customs/legends-and-oral-histories-of-the-northern-clans/"

[pages.campaign-wiki-create-page]
user = "norm"
path = "/campaigns/norm/the-long-road/create-page"

# notebooks
# ----------------------------------------------------------------------------
[pages.notebooks-list]
path = "/notebooks/"

[pages.notebooks-user-list]
user = "norm"
path = "/notebooks/norm/"

[pages.notebook-view]
user = "norm"
path = "/notebooks/norm/campaign-notes/"

[pages.notebook-create]
user = "norm"
path = "/notebooks/create"

[pages.notebook-create-page]
user = "norm"
path = "/notebooks/norm/campaign-notes/world-regions/northern-kingdoms/index?edit"

[pages.notebook-deleted]
user = "norm"
path = "/notebooks/deleted/norm/campaign-notes/"

[pages.notebook-settings]
user = "norm"
path = "/notebooks/settings/norm/campaign-notes/"

[pages.notebook-settings-wiki]
user = "norm"
path = "/notebooks/settings/norm/the-long-road-wiki/"

[pages.notebook-delete]
user = "norm"
path = "/notebooks/settings/norm/campaign-notes/"
steps = [
    { click = { text = "Delete notebook", role = "button" } },
]

[pages.notebook-restore]
user = "norm"
path = "/notebooks/deleted/norm/campaign-notes/"
steps = [
    { click = { text = "Restore", role = "link" } },
]

[pages.notebook-collaborator-confirm]
user = "norm"
path = "/notebooks/settings/norm/campaign-notes/"
steps = [
    { form = { selector = "form:has(input[name='username'])" } },
    { fill = { field = "username", value = "hugh" } },
    { select = { field = "role", value = "viewer" } },
    { click = { text = "Add", role = "button" } },
]

[pages.notebook-rename-confirm]
user = "norm"
path = "/notebooks/settings/norm/campaign-notes/"
steps = [
    { fill = { field = "name", value = "Campaign Notes Renamed" } },
    { click = { text = "Rename", role = "button" } },
]

[pages.notebook-visibility-confirm]
user = "norm"
path = "/notebooks/settings/norm/campaign-notes/"
steps = [
    { form = { selector = "form[action*='visibility']" } },
    { select = { field = "visibility", value = "public" } },
    { click = { text = "Change", role = "button" } },
]

[pages.notebook-session]
user = "norm"
path = "/notebooks/norm/campaign-notes/sessions/session-01"

[pages.notebook-session-edit]
user = "norm"
path = "/notebooks/norm/campaign-notes/sessions/session-01?edit"
