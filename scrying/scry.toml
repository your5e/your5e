[widths]
desktop = 1280
tablet = 768
mobile = 375

[users]
hugh = "hugh"
norm = "norm"
susan = "susan"
wendy = "wendy"

[pages.active-preview]
skip = true
user = "norm"
base_url = "http://localhost:5843"
path = "/notebooks/norm/campaign-notes/sessions/recaps/recap-session-01"
widths = []
add_widths = [{ name = "1024", value = 1024 }]

[pages.site-logout]
user = "norm"
path = "/logout"

[pages.site-home]
path = "/"

[pages.site-login]
path = "/login"

[pages.help-index]
path = "/help/"

[pages.help-api]
path = "/help/api/listing-notebooks"

[pages.help-obsidian-plugin]
path = "/help/obsidian-plugin"

[pages.help-roadmap]
path = "/help/roadmap"

[pages.user-profile-anon]
path = "/profile/norm"

[pages.user-profile-other]
user = "wendy"
path = "/profile/norm"

[pages.user-profile-owner]
user = "norm"
path = "/profile/norm"

[pages.user-password-change]
