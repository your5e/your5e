services:
  web:
    image: ghcr.io/your5e/your5e:latest
    environment:
      ALLOWED_HOSTS: your5e.com,www.your5e.com
      DB_NAME: your5e
      DB_USER: your5e
      DB_HOST: postgres_db
      DB_PORT: "5432"
    secrets:
      - db_password
      - secret_key
    networks:
      - traefik-public
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.your5e.rule=Host(`your5e.com`) || Host(`www.your5e.com`)
        - traefik.http.routers.your5e.entrypoints=websecure
        - traefik.http.routers.your5e.tls.certresolver=letsencrypt
        - traefik.http.services.your5e.loadbalancer.server.port=8000

secrets:
  db_password:
    external: true
  secret_key:
    external: true

networks:
  traefik-public:
    external: true
