services:
  db:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U your5e"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      POSTGRES_DB: your5e
      POSTGRES_USER: your5e
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - /var/lib/postgresql/data:/var/lib/postgresql/data
    networks:
      - backend
    secrets:
      - db_password
    deploy:
      resources:
        limits:
          memory: 512M
      placement:
        constraints:
          - node.role == manager

secrets:
  db_password:
    external: true

networks:
  backend:
    external: true
