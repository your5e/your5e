{% load notebook_permissions dates %}

<div class="version-controls">
  <form>
    <select name="{{ param_name }}">
      {% for version in versions %}
        <option value="{{ version.number }}" {% if version == selected %}selected{% endif %}>
          v{{ version.number }} by {{ version.created_by.username }},
          {{ version.created_at|smart_date }}
        </option>
      {% endfor %}
    </select>
    <button type="submit">View</button>
  </form>
  {% if notebook|can_edit:request.user %}
    <form>
      <input type="hidden" name="edit">
      <button type="submit">Edit</button>
    </form>
  {% endif %}
</div>
