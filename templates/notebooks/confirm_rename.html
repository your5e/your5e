{% extends "base.html" %}

{% block title %}Confirm rename - Your 5E{% endblock %}

{% block content %}
<h1>Confirm rename</h1>

<p>Rename "{{ notebook.name }}" to "{{ name }}"?</p>

<form method="post" action="{% url 'notebook_rename' %}">
  {% csrf_token %}
  <input type="hidden" name="notebook" value="{{ notebook.pk }}">
  <input type="hidden" name="name" value="{{ name }}">
  <input type="hidden" name="confirm" value="true">
  <button type="submit">Confirm</button>
</form>

<p><a href="{% url 'notebook_settings' username=notebook.owner.username slug=notebook.slug %}">Cancel</a></p>
{% endblock %}
