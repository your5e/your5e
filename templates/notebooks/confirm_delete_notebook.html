{% extends "base.html" %}

{% block title %}Delete {{ notebook.name }} - Your 5E{% endblock %}

{% block content %}
<h1>Delete {{ notebook.name }}</h1>

<p>This will permanently delete the notebook and all its pages.</p>

<form method="post" action="{% url 'notebook_delete' %}">
  {% csrf_token %}
  <input type="hidden" name="notebook" value="{{ notebook.pk }}">
  <input type="hidden" name="confirm" value="true">
  <button type="submit">Delete notebook</button>
</form>

<p><a href="{% url 'notebook' username=notebook.owner.username slug=notebook.slug %}">Cancel</a></p>
{% endblock %}
