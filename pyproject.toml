[project]
name = "your5e"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "bleach>=6.0",
    "django>=5.1",
    "django-cors-headers>=4.6",
    "django-registration>=3.4",
    "django-rest-knox>=5.0",
    "djangorestframework>=3.15",
    "gunicorn>=23.0",
    "markdown>=3.7",
    "psycopg[binary]>=3.2",
    "python-slugify>=8.0",
    "pyyaml>=6.0",
    "whatnext>=3.3.1",
    "whitenoise>=6.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.web"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.ruff]
line-length = 88
extend-exclude = ["migrations"]
preview = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "B",      # bugbear
    "I",      # isort
    "UP",     # pyupgrade
]
