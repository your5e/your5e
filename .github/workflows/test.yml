name: Test

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Start services
        run: make setup EXEC_FLAGS=-T

      - name: Run Python tests
        run: make test-django EXEC_FLAGS=-T

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Start test server
        run: make server-tests

      - name: Run integration tests
        run: make test-sync-integration

      - name: Stop test server
        run: make server-tests-down
