name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Start services
        run: make setup EXEC_FLAGS=-T

      - name: Run Python tests
        run: make test-django EXEC_FLAGS=-T

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Start test server
        run: make server-tests

      - name: Run integration tests
        run: make test-sync-integration

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install npm dependencies
        run: cd obsidian-plugin && npm ci

      - name: Run TypeScript tests
        run: make test-obsidian-plugin

      - name: Stop test server
        run: make server-tests-down
